name: Release

# Release Please tient une PR de release à jour (version, CHANGELOG) à partir des commits
# Conventional Commits poussés sur main ; la merger crée le tag et la Release GitHub, puis
# le job publish publie sur le Marketplace et joint le .vsix à la Release.
# Le lancement manuel publie la version de package.json de la branche choisie et crée la
# Release si elle manque : première publication, ou reprise après un échec de publication.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # always() : le job release-please est sauté lors d'un lancement manuel.
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release GitHub
      id-token: write # trusted publishing du Marketplace (OIDC), sans jeton stocké
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: xvfb-run -a npm run test:integration
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npx vsce package --no-dependencies -o "inlinetex-$VERSION.vsix"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # --skip-duplicate : une version déjà publiée n'arrête pas une reprise.
      - run: npx vsce publish --oidc --skip-duplicate --packagePath "inlinetex-$VERSION.vsix"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # Lancement manuel : la Release n'existe pas encore, ses notes viennent du CHANGELOG
      # (« ## 0.2.0 » ou « ## [0.3.0](…) »). Après Release Please, la Release garde ses notes.
      - if: github.event_name == 'workflow_dispatch'
        run: |
          awk -v v="$VERSION" 'index($0, "## " v) == 1 || index($0, "## [" v "]") == 1 { f = 1; next }
            f && /^## / { exit } f' CHANGELOG.md > notes.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: inlinetex-${{ steps.version.outputs.version }}.vsix
          body_path: ${{ github.event_name == 'workflow_dispatch' && 'notes.md' || '' }}
